name: Build KINEMA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      KINEMA_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        shell: pwsh
        run: dotnet publish src/Kinema/Kinema.csproj -c Release -o publish -p:Version=$env:KINEMA_VERSION

      - name: Bundle libmpv (decoders)
        shell: pwsh
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-2*.7z" -D tmp\mpv
          $a = Get-ChildItem tmp\mpv -Filter *.7z | Select-Object -First 1
          7z x $a.FullName -otmp\mpv\x -y | Out-Null
          $dll = Get-ChildItem tmp\mpv\x -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found" }
          Copy-Item $dll.FullName publish\

      - name: Bundle VapourSynth + MVTools (frame interpolation)
        continue-on-error: true
        shell: pwsh
        run: |
          gh release download -R capric98/vapoursynth-portable-win64 -D tmp\vs
          Get-ChildItem tmp\vs -File | ForEach-Object { 7z x $_.FullName -otmp\vs\x -y | Out-Null }
          $vss = Get-ChildItem tmp\vs -Recurse -Filter VSScript.dll | Select-Object -First 1
          if (-not $vss) { throw "VSScript.dll not found" }
          New-Item publish\vs -ItemType Directory -Force | Out-Null
          Copy-Item "$($vss.DirectoryName)\*" publish\vs -Recurse -Force
          gh release download -R dubhater/vapoursynth-mvtools -D tmp\mv
          Get-ChildItem tmp\mv -File | Where-Object { $_.Extension -in '.7z','.zip' } | ForEach-Object { 7z x $_.FullName -otmp\mv\x -y | Out-Null }
          $mv = Get-ChildItem tmp\mv -Recurse -Filter *.dll | Where-Object { $_.Name -match 'mvtools' }
          $pick = $mv | Where-Object { $_.FullName -match '64' } | Select-Object -First 1
          if (-not $pick) { $pick = $mv | Select-Object -First 1 }
          if (-not $pick) { throw "mvtools dll not found" }
          New-Item publish\vs\plugins -ItemType Directory -Force | Out-Null
          Copy-Item $pick.FullName publish\vs\plugins\

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\kinema.iss
          Compress-Archive -Path publish\* -DestinationPath dist\KINEMA-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: KINEMA
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KINEMA_VERSION }}
          name: KINEMA ${{ env.KINEMA_VERSION }}
          body: 下載 KINEMA-Setup.exe 安裝。KINEMA-portable.zip 為免安裝版（不含副檔名關聯）。
          files: |
            dist/KINEMA-Setup.exe
            dist/KINEMA-portable.zip
